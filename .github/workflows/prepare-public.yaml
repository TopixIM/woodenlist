name: Protected Woodenlist public methods migration
on:
  push:
    branches: [prepare/woodenlist-public-0301]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"
      - run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          test ! -e compact.cirru
          test ! -e package.cirru
      - uses: actions/checkout@v7.0.1
        with:
          repository: calcit-lang/calcit
          ref: 0.30.1
          path: .calcit/core-test-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/run-core-tests.mjs
            /scripts/core-test-protocol.mjs
            /scripts/core-tests-exclusions.cirru
            /docs/installation/wasm-support.md
      - name: Original full gates and tests
        run: node prepare-public.mjs before && node prepare-public.mjs gates before
      - name: Exact official source transaction
        run: node prepare-public.mjs apply
      - name: Candidate unchanged original gates and tests
        run: node prepare-public.mjs gates after && node prepare-public.mjs after
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: accepted-source
          path: calcit.cirru
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: accepted-runtime
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: diagnostics
          path: acceptance/
          if-no-files-found: warn


